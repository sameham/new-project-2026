name: Build Android APK

on:
  # شغّل عند كل push على main
  push:
    branches: [ main ]
  # شغّل عند كل Pull Request
  pull_request:
    branches: [ main ]
  # شغّل يدوي من Actions tab
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Tests
        run: flutter test || echo "⚠️ Tests failed but continuing build"

      - name: 🏗️ Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "🐛 Building DEBUG APK..."
            flutter build apk --debug
          else
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release
          fi

      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elmahdi-travel-suite-${{ github.event.inputs.build_type || 'release' }}
          description: Elmahdi Travel Suite ${{ github.event.inputs.build_type || 'release' }} APK
          path: build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type || 'release' }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Build Summary
        if: success()
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** Elmahdi Travel Suite v1.0.0+1" >> $GITHUB_STEP_SUMMARY
          echo "**Build type:** ${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** \`app-${{ github.event.inputs.build_type || 'release' }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 حمّل الـ APK من **Artifacts** فوق" >> $GITHUB_STEP_SUMMARY