name: Build Release APK + Auto Release

on:
  # شغّل عند tag جديد زي v1.0.0
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: 📤 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌍 Elmahdi Travel Suite v${{ github.ref_name }}

            تطبيق إدارة شركة السياحة والسفر - Sameh Abdullah Travel & Tourism Agency

            ### 📱 APKs المتاحة:
            - **arm64-v8a** — الأجهزة الحديثة (موصى به)
            - **armeabi-v7a** — الأجهزة القديمة
            - **x86_64** — المحاكيات والأجهزة النادرة

            ### ✅ الـ Stack:
            - Flutter 3.24 + Dart
            - Drift (SQLite) + Supabase
            - Riverpod + GoRouter
            - PDF generation + fl_chart